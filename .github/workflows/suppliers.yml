name: Update supplier tariffs

on:
  schedule:
    - cron: "17 4 * * *" # daily; tariffs change a few times a year
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  suppliers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium (only if a supplier needs it)
        run: |
          if grep -q '"render": *"browser"' suppliers/*.json; then
            npx playwright install --with-deps chromium
          fi
      - run: npm run suppliers
      - run: npm run derive
      - run: npm run validate
      - name: Commit data
        run: |
          .github/scripts/commit-data.sh "data: supplier tariffs $(TZ=Europe/Amsterdam date +%F)"

      # Keep one open issue listing broken scrape rules, so maintainers notice.
      - name: Report broken scrape rules
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Scraper: some supplier rules are failing"
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if grep -q "⚠️" data/REPORT.md; then
            if [ -n "$existing" ]; then
              gh issue edit "$existing" --body-file data/REPORT.md
            else
              gh issue create --title "$title" --body-file data/REPORT.md
            fi
          elif [ -n "$existing" ]; then
            gh issue close "$existing" --comment "All scrape rules work again."
          fi
