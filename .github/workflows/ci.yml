name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["data/**"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate
      # Rebuild supplier data from the configs (no network) to prove the PR produces valid output.
      - run: npm run suppliers -- --offline && npm run derive && npm run validate
