name: Controle

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["data/**"]

jobs:
  controle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecontrole
      - run: npm test
      - run: npm run valideer
      # Rebuild supplier data from the configs (no network) to prove the PR produces valid output.
      - run: npm run belasting -- --offline && npm run leveranciers -- --offline && npm run afleiden && npm run valideer
