name: Update market prices

on:
  schedule:
    # Day-ahead results are published around 12:45 CET. Several runs so tomorrow
    # is picked up as soon as it's available; each run commits only if data changed.
    # 22:05/23:05 UTC roll latest.json and compare/latest.json over to the new day.
    - cron: "5 11,12,13,15,22,23 * * *"
  workflow_dispatch:
    inputs:
      from:
        description: "Backfill from date (YYYY-MM-DD, optional)"
        required: false
      to:
        description: "Backfill to date (YYYY-MM-DD, optional)"
        required: false

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fetch prices
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
        run: npm run prices -- $FROM $TO
      - run: npm run derive
      - run: npm run validate
      - name: Commit data
        run: |
          .github/scripts/commit-data.sh "data: market prices $(TZ=Europe/Amsterdam date +%F)"
